name: deploy-site

# push 即发布：页面文件变更时自动同步到 S3 站点 bucket 并刷新 CloudFront
on:
  push:
    branches: [main]
    paths: ["index.html", "mascot.html"]
  workflow_dispatch:

permissions:
  id-token: write # OIDC 换取 AWS 临时凭证，仓库里不存长期密钥
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC claims (temporary)
        run: |
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c "
          import json,sys,base64
          tok=json.load(sys.stdin)['value']
          p=tok.split('.')[1]; p+='='*(-len(p)%4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=1))
          "

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Sync pages to site bucket
        run: |
          aws s3 cp index.html s3://onewonder-public-site/index.html --content-type "text/html; charset=utf-8"
          aws s3 cp mascot.html s3://onewonder-public-site/mascot.html --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2PSKJQMU4ZWTB --paths "/*"
