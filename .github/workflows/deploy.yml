name: deploy-site

# push 即发布：页面文件变更时自动同步到 S3 站点 bucket 并刷新 CloudFront
on:
  push:
    branches: [main]
    # og.png も対象に入れる：index.html だけを push すると og:image が 404 を返し、
    # その 404 が SNS 側にキャッシュされて後から直しても反映されない
    paths: ["index.html", "mascot.html", "og.png"]
  workflow_dispatch:

permissions:
  id-token: write # OIDC 换取 AWS 临时凭证，仓库里不存长期密钥
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Sync pages to site bucket
        run: |
          aws s3 cp index.html s3://onewonder-public-site/index.html --content-type "text/html; charset=utf-8"
          aws s3 cp mascot.html s3://onewonder-public-site/mascot.html --content-type "text/html; charset=utf-8"
          # OG 画像は内容が変わらないので長めにキャッシュさせる（HTML は既定どおり）
          aws s3 cp og.png s3://onewonder-public-site/og.png --content-type "image/png" --cache-control "public, max-age=86400"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E2PSKJQMU4ZWTB --paths "/*"
